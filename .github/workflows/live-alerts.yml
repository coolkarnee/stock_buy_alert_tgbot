name: NSE Live Telegram Alerts

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nse-live-monitor-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  live-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download prior-day performance conclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow live-performance.yml --branch "${GITHUB_REF_NAME}" --status completed --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name live-alert-performance --dir prior_performance || true
            find prior_performance -name performance_summary.txt -exec cp {} ./performance_summary.txt \; || true
          fi
      - name: Run live scanner
        # Stop this step before GitHub's 6h job kill so the always() save steps below still run.
        timeout-minutes: 355
        run: python -u live_monitor.py
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit market breadth and signal history
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in artifacts/market_breadth.csv artifacts/signal_history.csv; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No market breadth or signal history changes to commit."
          else
            git commit -m "Update market breadth and signal history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Save today's BUY alert log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-alerts
          path: live_alerts.csv
          if-no-files-found: warn
          retention-days: 7
