name: NSE Live Telegram Alerts

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nse-live-monitor-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  live-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set scanner shutdown deadline
        run: echo "SCANNER_STOP_AT=$(( $(date +%s) + 358 * 60 ))" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download prior-day performance conclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow live-performance.yml --branch "${GITHUB_REF_NAME}" --status completed --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name live-alert-performance --dir prior_performance || true
            find prior_performance -name performance_summary.txt -exec cp {} artifacts/performance_summary.txt \; || true
          fi
      - name: Run live scanner
        timeout-minutes: 358
        run: |
          REMAINING_SECONDS=$(( SCANNER_STOP_AT - $(date +%s) ))
          if [ "$REMAINING_SECONDS" -le 0 ]; then
            echo "Scanner shutdown deadline already reached."
            exit 1
          fi
          if timeout --signal=INT --kill-after=30s "${REMAINING_SECONDS}s" python -u -m jobs.live_monitor; then
            exit 0
          else
            STATUS=$?
            if [ "$STATUS" -eq 124 ]; then
              echo "Scanner session deadline reached; proceeding to save logs."
            else
              exit "$STATUS"
            fi
          fi
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save today's alert log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-alerts
          path: artifacts/live_alerts.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Commit market breadth and signal history
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in artifacts/market_breadth.csv artifacts/signal_history.csv; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No market breadth or signal history changes to commit."
          else
            git commit -m "Update market breadth and signal history"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
