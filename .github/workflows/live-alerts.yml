name: NSE Live Telegram Alerts

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nse-live-monitor-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  live-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set scanner shutdown deadline
        run: echo "SCANNER_STOP_AT=$(( $(date +%s) + 358 * 60 ))" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download prior-day performance conclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow live-performance.yml --branch "${GITHUB_REF_NAME}" --status completed --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name live-alert-performance --dir prior_performance || true
            find prior_performance -name performance_summary.txt -exec cp {} artifacts/performance_summary.txt \; || true
          fi
      - name: Run stock and commodity scanners
        timeout-minutes: 358
        run: |
          REMAINING_SECONDS=$(( SCANNER_STOP_AT - $(date +%s) ))
          if [ "$REMAINING_SECONDS" -le 0 ]; then
            echo "Scanner shutdown deadline already reached."
            exit 1
          fi
          mkdir -p artifacts
          timeout --signal=INT --kill-after=30s "${REMAINING_SECONDS}s" \
            python -u -m jobs.live_monitor > artifacts/stock_alerts.log 2>&1 &
          STOCK_PID=$!
          timeout --signal=INT --kill-after=30s "${REMAINING_SECONDS}s" \
            python -u -m jobs.commodity_monitor > artifacts/commodity_alerts.log 2>&1 &
          COMMODITY_PID=$!

          STOCK_STATUS=0
          if wait "$STOCK_PID"; then
            STOCK_STATUS=0
          else
            STOCK_STATUS=$?
          fi
          COMMODITY_STATUS=0
          if wait "$COMMODITY_PID"; then
            COMMODITY_STATUS=0
          else
            COMMODITY_STATUS=$?
          fi

          if [ "$STOCK_STATUS" -eq 124 ] || [ "$COMMODITY_STATUS" -eq 124 ]; then
            echo "Scanner session deadline reached; proceeding to save logs."
          fi
          if [ "$STOCK_STATUS" -ne 0 ] && [ "$STOCK_STATUS" -ne 124 ]; then
            echo "Stock scanner failed with status $STOCK_STATUS."
            exit "$STOCK_STATUS"
          fi
          if [ "$COMMODITY_STATUS" -ne 0 ] && [ "$COMMODITY_STATUS" -ne 124 ]; then
            echo "Commodity scanner failed with status $COMMODITY_STATUS."
            exit "$COMMODITY_STATUS"
          fi
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save today's alert log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-alerts
          path: |
            artifacts/live_alerts.csv
            artifacts/stock_alerts.log
            artifacts/commodity_alerts.log
            artifacts/commodity_alerts.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Commit market breadth and signal history
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in artifacts/market_breadth.csv artifacts/signal_history.csv artifacts/trading_sessions.csv; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No market breadth or signal history changes to commit."
          else
            git commit -m "Update market breadth and signal history"
            # Other scanner outputs have already been uploaded as artifacts.
            # Stash them so the rebase has a clean worktree.
            git stash push --include-untracked -m "temporary scanner outputs"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
