name: NSE Live Telegram Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1-5'

concurrency:
  group: nse-live-monitor-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  live-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run live scanner
        run: python -u live_monitor.py
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save today's BUY alert log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-alerts
          path: live_alerts.csv
          if-no-files-found: warn
          retention-days: 7
