name: Test IPO Universe

on:
  workflow_dispatch:

jobs:
  test-ipo-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test IPO universe
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python -c "from scanner.universe import _listed_ipo_dates, recent_ipo_listing_dates, ipo_cutoff_date; listings=recent_ipo_listing_dates(_listed_ipo_dates()); print(f'IPO count listed since {ipo_cutoff_date()}:', len(listings)); print('Symbols:'); print('\\n'.join(sorted(listings)))"
